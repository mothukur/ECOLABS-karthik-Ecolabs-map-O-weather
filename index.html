<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>India Weather Map – Solar Car Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#16222e;--mut:#5d6b7a;--bg:#fff;--line:#e3e8ee;--acc:#0f6b8f;--sh:0 4px 18px rgba(20,40,60,.16)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0;background:#cfe3ee}
.leaflet-container{font-family:inherit}
.card{background:var(--bg);border-radius:14px;box-shadow:var(--sh)}
#top{position:absolute;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:9px 14px;white-space:nowrap}
#brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
#status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
#dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:pulse 1.2s infinite}
#dot.ok{background:#22c55e;animation:none}#dot.err{background:#ef4444;animation:none}
@keyframes pulse{50%{opacity:.3}}
#sw{position:relative;flex:1;max-width:380px}
#q{width:100%;height:46px;border:0;border-radius:14px;padding:0 14px;font:inherit;box-shadow:var(--sh);outline:none}
#q:focus{box-shadow:var(--sh),0 0 0 2px var(--acc)}
#res{position:absolute;top:50px;left:0;right:0;overflow:hidden;display:none}
#res button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
#res button:hover{background:#f1f6f9}#res small{color:var(--mut);display:block}
#bt{height:46px;padding:0 14px;border:0;cursor:pointer;font:inherit;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
#bt span{font-size:18px}
#ctl{position:absolute;z-index:1000;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 64px);display:flex;flex-direction:column;gap:8px}
#ctl button{width:44px;height:44px;border:0;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:19px;cursor:pointer;color:var(--ink)}
#ctl button:active{background:#e8f1f5}
#ctl button.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#lay{position:absolute;z-index:1000;right:62px;top:calc(max(10px,env(safe-area-inset-top)) + 64px);padding:10px 14px;display:none;max-height:calc(100% - 150px);overflow-y:auto}
#lay label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer;white-space:nowrap}
.lh{font-weight:600;margin:8px 0 6px;font-size:13px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}.chip:disabled{opacity:.45}
#lgwrap{position:absolute;z-index:1000;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 64px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#rtbtn{border:0;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);display:flex;gap:6px;align-items:center}
#legend{padding:8px 10px;font-size:12.5px}
#legend summary{cursor:pointer;font-weight:600;padding:2px 0;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#lgb{margin-top:4px}
#lgb>div{display:flex;align-items:center;gap:8px;padding:5px 0}
#lgb>div+div{border-top:1px solid #dde4ea}
#legend i{width:16px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
#sheet{position:absolute;z-index:1100;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,760px);max-height:36vh;min-height:190px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 28px rgba(20,40,60,.22);transform:translateY(105%);transition:transform .33s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none}#sheet.drag{transition:none}
#grab{flex:none;height:26px;position:relative;touch-action:none;cursor:grab}
#grab i{position:absolute;left:50%;top:9px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#cbd5df}
#x{position:absolute;right:8px;top:2px;border:0;background:none;font-size:18px;width:36px;height:30px;cursor:pointer;color:var(--mut)}
#sbody{overflow-y:auto;padding:0 16px 14px;-webkit-overflow-scrolling:touch}
.hd{display:flex;gap:14px;align-items:center}
.ic{font-size:46px;line-height:1}.tp{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.cd{color:var(--mut);font-size:14px}.pl{margin-left:auto;text-align:right;max-width:52%}
.pl b{display:block;font-size:16px}.pl span{display:block;color:var(--mut);font-size:12.5px}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:12px 0}
.st div{background:#f2f6f9;border-radius:10px;padding:7px 10px}.st small{display:block;color:var(--mut);font-size:11.5px}
.sp{font-weight:600;margin:6px 0;font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip div{flex:none;min-width:68px;text-align:center;background:#f2f6f9;border-radius:10px;padding:7px 8px;font-size:13px}
.strip span{display:block;font-size:22px}.strip small{color:var(--mut);display:block;font-size:11.5px}
.ld{padding:22px;text-align:center;color:var(--mut)}
.cl,.rl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-size:11px;font-weight:600;padding:0 4px;color:#1d2b38}
.cl:before,.rl:before{display:none}.nolbl .cl{display:none}
.sl{background:none;border:0}
.sl span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#1d2b38;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
#rtmodal{position:fixed;inset:0;z-index:1300;background:rgba(15,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 12px 12px}
#rtmodal[hidden]{display:none}
.rtbox{position:relative;width:min(100%,420px);padding:18px;display:flex;flex-direction:column;gap:8px}
.rtbox h2{margin:0 0 4px;font-size:18px}.rtbox label{font-size:13px;font-weight:600;color:var(--mut)}
.rtbox input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
.rtbox input:focus{outline:2px solid var(--acc);border-color:transparent}
.fld{position:relative}
.sg{position:absolute;top:46px;left:0;right:0;background:#fff;border-radius:10px;box-shadow:var(--sh);display:none;z-index:2;overflow:hidden}
.sg button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.sg button:hover{background:#f1f6f9}.sg small{color:var(--mut);display:block}
.rtclose{position:absolute;right:8px;top:8px;border:0;background:none;font-size:18px;cursor:pointer;width:36px;height:36px;color:var(--mut)}
.go{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.ract{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:6px}
#rmsg{color:#b91c1c;font-size:13px}
#sheet.big{max-height:50vh}
.pw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pc{background:#f2f6f9;border-radius:12px;padding:9px 11px}
.pc b{font-size:13px;display:block}.pc big{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.pc small{display:block;color:var(--mut);font-size:11.5px;line-height:1.35}
.pc.tot{background:var(--acc);color:#fff}.pc.tot small{color:#d6edf5}
.fn{color:var(--mut);font-size:11.5px;margin:2px 0 10px}
@media(max-width:640px){.pw{grid-template-columns:repeat(2,1fr)}}
.toast{position:fixed;z-index:1500;left:50%;top:70px;transform:translateX(-50%);padding:10px 16px;background:#16222e;color:#fff;border-radius:10px;font-size:13px;max-width:90%;text-align:center}
@media(max-width:640px){#brand{display:none}#q{height:44px}#bt{height:44px;padding:0 12px}#bt b{display:none}#lgwrap{top:auto;bottom:12px}#sheet{min-height:180px}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="brand" class="card"><h1>India Weather Map</h1><div id="status"><span id="dot"></span><span id="stx">Loading live weather...</span></div></div>
  <div id="sw"><input id="q" type="search" placeholder="Search city or state" autocomplete="off" aria-label="Search"><div id="res" class="card"></div></div>
  <button id="bt" class="card" aria-label="Switch between map and satellite"><span>🛰️</span><b>Satellite</b></button>
</div>
<div id="ctl">
  <button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button>
  <button id="loc" aria-label="My location">◎</button><button id="rst" aria-label="Reset view">⌂</button>
  <button id="ref" aria-label="Refresh weather">⟳</button><button id="lyb" aria-label="Layers and regions">☰</button>
</div>
<div id="lay" class="card">
  <label><input type="checkbox" data-l="wx" checked> Weather regions</label>
  <label><input type="checkbox" data-l="bd" checked> Boundaries &amp; names</label>
  <label><input type="checkbox" data-l="ct" checked> Cities</label>
  <label><input type="checkbox" data-l="nt" checked> Night shading</label>
  <div class="lh">Regions</div><div class="chips" id="chips"></div>
</div>
<div id="lgwrap"><button id="rtbtn" class="card">🧭 Route</button><details id="legend" class="card" open><summary>Weather legend</summary><div id="lgb"></div></details></div>
<section id="sheet" aria-live="polite"><div id="grab"><i></i><button id="x" aria-label="Close">✕</button></div><div id="sbody"></div></section>

<div id="rtmodal" role="dialog" aria-modal="true" aria-labelledby="rtt" hidden><div class="card rtbox">
  <button id="rtx" class="rtclose" aria-label="Close">✕</button><h2 id="rtt">Plan a route</h2>
  <label for="rfrom">Starting point</label>
  <div class="fld"><input id="rfrom" placeholder="City, town or village" autocomplete="off"><div class="sg" id="sgf"></div></div>
  <button id="ruse" type="button" class="chip">📍 Use my current location</button>
  <label for="rto">Destination</label>
  <div class="fld"><input id="rto" placeholder="City, town or village" autocomplete="off"><div class="sg" id="sgt"></div></div>
  <div id="rmsg" role="alert"></div>
  <div class="ract"><button id="rclr" type="button" class="chip" hidden>Clear route</button><button id="rgo" type="button" class="go" disabled>Show route</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script>
"use strict";
/* ================= CONFIG ================= */
// India state boundaries (tried in order) and world country boundaries (Natural Earth, includes continent field).
const STATE_URLS=[
 "https://gist.githubusercontent.com/jbrobst/56c13bbbf9d97d187fea01ca62ea5112/raw/e388c4cae20aa53cb5090210a42ebb9b765c0a36/india_states.geojson",
 "https://raw.githubusercontent.com/Subhash9325/GeoJson-Data-of-Indian-States/master/Indian_States",
 "https://cdn.jsdelivr.net/gh/udit-001/india-maps-data@main/geojson/india.geojson"];
const WORLD_URLS=[
 "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson",
 "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"];
const TTL=30*60e3,CHUNK=40;
const CITIES=[["Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Kolkata",22.57,88.36],["Chennai",13.08,80.27],["Bengaluru",12.97,77.59],["Hyderabad",17.39,78.49],["Ahmedabad",23.02,72.57],["Pune",18.52,73.86],["Jaipur",26.91,75.79],["Lucknow",26.85,80.95],["Kanpur",26.45,80.33],["Nagpur",21.15,79.09],["Bhopal",23.26,77.41],["Patna",25.59,85.14],["Chandigarh",30.73,76.78],["Srinagar",34.08,74.8],["Leh",34.15,77.58],["Amritsar",31.63,74.87],["Dehradun",30.32,78.03],["Guwahati",26.14,91.74],["Shillong",25.57,91.88],["Bhubaneswar",20.3,85.82],["Raipur",21.25,81.63],["Ranchi",23.34,85.31],["Visakhapatnam",17.69,83.22],["Kochi",9.93,76.27],["Thiruvananthapuram",8.52,76.94],["Madurai",9.93,78.12],["Panaji",15.5,73.83],["Jodhpur",26.24,73.02],["Indore",22.72,75.86],["Surat",21.17,72.83],["Varanasi",25.32,83.0],["Gangtok",27.33,88.61],["Port Blair",11.62,92.73],["Itanagar",27.08,93.62],["Agartala",23.83,91.28],["Imphal",24.82,93.94],["Shimla",31.1,77.17],["Mysuru",12.3,76.64]];
const OTHER="London,51.51,-0.13;Paris,48.86,2.35;Berlin,52.52,13.4;Madrid,40.42,-3.7;Rome,41.9,12.5;Moscow,55.76,37.62;Istanbul,41.01,28.98;Kyiv,50.45,30.52;Warsaw,52.23,21.01;Stockholm,59.33,18.07;Athens,37.98,23.73;Beijing,39.9,116.4;Shanghai,31.23,121.47;Tokyo,35.68,139.69;Seoul,37.57,126.98;Bangkok,13.76,100.5;Singapore,1.35,103.82;Jakarta,-6.21,106.85;Manila,14.6,120.98;Hanoi,21.03,105.85;Kuala Lumpur,3.14,101.69;Dubai,25.2,55.27;Riyadh,24.71,46.68;Tehran,35.69,51.39;Karachi,24.86,67.0;Dhaka,23.81,90.41;Kathmandu,27.72,85.32;Colombo,6.93,79.86;Almaty,43.24,76.89;Tashkent,41.3,69.24;Novosibirsk,55.03,82.92;Ulaanbaatar,47.89,106.91;New York,40.71,-74.01;Los Angeles,34.05,-118.24;Chicago,41.88,-87.63;Toronto,43.65,-79.38;Vancouver,49.28,-123.12;Mexico City,19.43,-99.13;Havana,23.11,-82.37;Anchorage,61.22,-149.9;São Paulo,-23.55,-46.63;Rio de Janeiro,-22.91,-43.17;Buenos Aires,-34.6,-58.38;Lima,-12.05,-77.04;Bogotá,4.71,-74.07;Santiago,-33.45,-70.67;Caracas,10.48,-66.9;Quito,-0.18,-78.47".split(";").map(s=>{const a=s.split(",");return[a[0],+a[1],+a[2]]});
const ALLC=CITIES.concat(OTHER);
// The six weather types shown on the map.
const CL=[["Sunny","#fbbf24","☀️"],["Cloudy","#94a3b8","☁️"],["Drizzle","#7dd3fc","🌦️"],["Rain","#2563eb","🌧️"],["Storm","#7c3aed","⛈️"],["Snow","#c7d2fe","❄️"],["Night","#1e293b","🌙"]];
const K={SUN:0,CLD:1,DRZ:2,RAIN:3,STM:4,SNW:5,NIT:6};
const WMO={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Dense drizzle"],56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["🌨️","Snow grains"],80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Violent showers"],85:["🌨️","Snow showers"],86:["🌨️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm, hail"],99:["⛈️","Thunderstorm, hail"]};
const CUR="temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m";
const SUBC=["PAK","BGD","NPL","BTN","LKA"]; // neighbours that complete the "Indian subcontinent" region
// Each region has its own grid: bounds [W,S,E,N], cell size, sample spacing (degrees), canvas scale.
const ZDEF={
 sub:{name:"Indian subcontinent",b:[60.5,5.5,98,37.8],step:.2,sp:2,sc:4,sm:[2,1]},
 asia:{name:"Rest of Asia",b:[26,-11,180,78],step:.5,sp:5,sc:3,sm:[3,2]},
 eu:{name:"Europe",b:[-25,34,60,72],step:.4,sp:4,sc:3,sm:[3,2]},
 af:{name:"Africa",b:[-20,-36,52,38],step:.5,sp:5,sc:3,sm:[3,2]},
 na:{name:"North America",b:[-170,7,-10,84],step:.5,sp:6,sc:3,sm:[3,2]},
 sa:{name:"South America",b:[-82,-56,-34,13],step:.4,sp:5,sc:3,sm:[3,2]},
 oc:{name:"Australia & Oceania",b:[110,-48,180,2],step:.4,sp:4,sc:3,sm:[3,2]}};

/* ================= HELPERS ================= */
const R=Math.PI/180,mercY=l=>Math.log(Math.tan(Math.PI/4+l*R/2)),invY=y=>(2*Math.atan(Math.exp(y))-Math.PI/2)/R;
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stName=p=>p.ST_NM||p.NAME_1||p.st_nm||p.NAME||p.name||p.State||p.state||"";
const A3=f=>f.properties.ADM0_A3||f.properties.adm0_a3||"",CONT=f=>f.properties.CONTINENT||f.properties.continent||"";
let map,states=null,world=null,zones=[],sat=false,hl=null,selTok=0;
const F={wx:true,bd:true,ct:true,nt:true},detailCache={};

/* ================= WEATHER FETCH ================= */
async function fetchChunk(ch){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${ch.map(p=>p[0]).join(",")}&longitude=${ch.map(p=>p[1]).join(",")}&current=${CUR}&timezone=auto`;
  for(let a=0;a<2;a++){
    const r=await fetch(u);
    if(r.status===429){await sleep(15000);continue}   // rate limited: wait and retry once
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();return Array.isArray(j)?j:[j];
  }
  throw new Error("rate limited");
}
/* One of the six weather types for a sample point. Rain/storm/snow outrank temperature and sky cover. */
function ptCat(p){const c=p.code;
  if(c>=95)return K.STM;
  if((c>=71&&c<=77)||c===85||c===86)return K.SNW;
  if((c>=61&&c<=67)||(c>=80&&c<=82)||p.pr>=.6)return K.RAIN;
  if((c>=51&&c<=57)||p.pr>.1)return K.DRZ;
  return p.cl>=55?K.CLD:(p.day===0?K.NIT:K.SUN);   // clear sky after dark = Night
}

/* ================= ZONE: grid, mask, weather regions ================= */
class Zone{
  constructor(id,items){
    const d=ZDEF[id];Object.assign(this,{id,items,name:d.name,b:d.b,step:d.step,sp:d.sp,sc:d.sc,sm:d.sm});
    const [W,S,E,N]=d.b;this.W=W;this.dY=d.step*R;this.yTop=mercY(N);
    this.gw=Math.ceil((E-W)/d.step);this.gh=Math.ceil((this.yTop-mercY(S))/this.dY);
    this.E=W+this.gw*d.step;this.S=invY(this.yTop-this.gh*this.dY);
    this.rowLat=Array.from({length:this.gh},(_,j)=>invY(this.yTop-(j+.5)*this.dY));
    this.pts=[];this.on=false;this.last=0;this.busy=false;this.fail=false;this.cls=null;this.ov=null;this.labels=null;
    this.inside=new Uint8Array(this.gw*this.gh);this.buildMask();
    this.lines=L.geoJSON({type:"FeatureCollection",features:items.map(i=>i.f)},{interactive:false,style:{color:"#27384a",weight:1,fillOpacity:0,opacity:.65}});
    this.lg=L.layerGroup().addTo(map);
  }
  cellOf(ll){return[Math.floor((ll.lng-this.W)/this.step),Math.floor((this.yTop-mercY(ll.lat))/this.dY)]}
  /* Rasterise the land outline once; it clips the colours to land and tells us which cells are "inside". */
  buildMask(){
    const {gw,gh,sc,W,step,yTop,dY}=this,w=gw*sc,h=gh*sc;
    const m=this.maskC=document.createElement("canvas");m.width=w;m.height=h;const c=m.getContext("2d");c.fillStyle="#000";
    const X=x=>(x-W)/(gw*step)*w,Y=y=>(yTop-mercY(y))/(gh*dY)*h;
    this.items.forEach(it=>{
      const g=it.f.geometry,polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];

      polys.forEach(poly=>{c.beginPath();

    sc2.drawImage(m,0,0,gw,gh);const d=sc2.getImageData(0,0,gw,gh).data;

  /* Sample points on a coarse grid, keeping only those near land. */
  samplePts(){
    const out=[],[W,S,E,N]=this.b,sp=this.sp,r=Math.ceil(sp*.55/this.step),{gw,gh}=this;
    for(let la=Math.ceil(S/sp)*sp;la<=N;la+=sp)for(let lo=Math.ceil(W/sp)*sp;lo<=E;lo+=sp){

      for(let j=Math.max(0,cj-r);j<=Math.min(gh-1,cj+r)&&!ok;j++)for(let i=Math.max(0,ci-r);i<=Math.min(gw-1,ci+r);i++)if(this.inside[j*gw+i]){ok=1;break}

  async load(force){

        if(c&&Date.now()-c.t<TTL&&c.pts.length){this.pts=c.pts;this.last=c.t;this.render();return}}catch(e){}}
      const P=this.samplePts(),got=[];

        const ch=P.slice(k,k+CHUNK);
        try{(await fetchChunk(ch)).forEach((o,i)=>{const c=o.current;
          if(c&&c.temperature_2m!=null){const p={lat:ch[i][0],lon:ch[i][1],t:c.temperature_2m,code:c.weather_code,pr:c.precipitation||0,cl:c.cloud_cover||0,day:c.is_day};p.k=ptCat(p);got.push(p)}})}

  /* IDW-interpolate to every cell, vote for one of six weather types, mode-filter to merge neighbours,

  render(){

    const {gw,gh,pts,rowLat,W,step}=this,raw=new Uint8Array(gw*gh),T=new Float32Array(gw*gh),D=[0,0,0,0],I=[0,0,0,0];
    for(let j=0;j<gh;j++){const lat=rowLat[j],kx=Math.cos(lat*R);
      for(let i=0;i<gw;i++){
        const lon=W+(i+.5)*step;D.fill(1e9);
        for(let n=0;n<pts.length;n++){const p=pts[n],dx=(p.lon-lon)*kx,dy=p.lat-lat,d=dx*dx+dy*dy;
          if(d<D[3]){let m=3;while(m>0&&D[m-1]>d){D[m]=D[m-1];I[m]=I[m-1];m--}D[m]=d;I[m]=n}}
        const V=[0,0,0,0,0,0,0];let sw=0,t=0,cl=0;
        for(let m=0;m<4;m++){if(D[m]>=1e9)continue;const p=pts[I[m]],w=1/(D[m]+.05);sw+=w;t+=w*p.t;cl+=w*p.cl;V[p.k]+=w}
        let best=-1,bv=0;
        for(const k of [K.STM,K.SNW,K.RAIN,K.DRZ])if(V[k]>=.4*sw&&V[k]>bv){best=k;bv=V[k]}
        if(best<0&&V[K.RAIN]+V[K.DRZ]>=.5*sw)best=V[K.RAIN]>=V[K.DRZ]?K.RAIN:K.DRZ;
        if(best<0)best=cl/sw>=55?K.CLD:(V[K.NIT]>V[K.SUN]?K.NIT:K.SUN);
        raw[j*gw+i]=best;T[j*gw+i]=t/sw;

    this.cls=this.modeFilter(this.modeFilter(raw,this.sm[0]),this.sm[1]);this.tmp=T;
    const s=document.createElement("canvas");s.width=gw;s.height=gh;const sc=s.getContext("2d"),im=sc.createImageData(gw,gh);
    const rgb=CL.map(c=>[1,3,5].map(o=>parseInt(c[1].substr(o,2),16)));
    for(let k=0;k<gw*gh;k++){const c=rgb[this.cls[k]];im.data.set([c[0],c[1],c[2],this.cls[k]===K.NIT?0:255],k*4)}

  modeFilter(a,r){

  /* Flood-fill the connected zone of identical weather under a click and summarise it. */
  regionAt(ll,quick){
    if(!this.cls)return null;

    if(i<0||j<0||i>=gw||j>=gh||!inside[j*gw+i])return null;
    if(quick)return true;
    const c0=cls[j*gw+i],seen=new Uint8Array(gw*gh),st=[j*gw+i],cells=[];seen[st[0]]=1;
    while(st.length){const k=st.pop();cells.push(k);const x=k%gw,y=(k/gw)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;

    const cnt={},step=Math.max(1,Math.floor(cells.length/60));

      for(const it of this.items){const b=it.f._bb;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;
        if((it.lo!=null&&x<it.lo)||(it.hi!=null&&x>it.hi))continue;
        if(turf.booleanPointInPolygon(pt,it.f)){cnt[it.name]=(cnt[it.name]||0)+1;break}}}
    const tot=Object.values(cnt).reduce((a,b)=>a+b,0)||1;

/* ================= ZONE MANAGEMENT ================= */
function getZone(id){
  let z=zones.find(q=>q.id===id);if(z)return z;
  const mk=(f,x)=>Object.assign({f,name:stName(f.properties)},x||{});
  const W=world?world.features.filter(f=>A3(f)!=="IND"&&A3(f)!=="ATA"):[];let items;
  if(id==="sub")items=states.features.map(f=>mk(f)).concat(W.filter(f=>SUBC.includes(A3(f))).map(f=>mk(f,{world:1})));
  else if(id==="asia")items=W.filter(f=>CONT(f)==="Asia"&&!SUBC.includes(A3(f))).map(f=>mk(f,{world:1})).concat(W.filter(f=>A3(f)==="RUS").map(f=>mk(f,{world:1,lo:60})));
  else if(id==="eu")items=W.filter(f=>CONT(f)==="Europe"&&A3(f)!=="RUS").map(f=>mk(f,{world:1})).concat(W.filter(f=>A3(f)==="RUS").map(f=>mk(f,{world:1,hi:60})));
  else items=W.filter(f=>CONT(f)==={na:"North America",sa:"South America",af:"Africa",oc:"Oceania"}[id]).map(f=>mk(f,{world:1}));
  items.forEach(it=>{if(!it.f._bb)it.f._bb=turf.bbox(it.f)});
  z=new Zone(id,items);zones.push(z);return z;
}
function setZone(id,on,fly){
  const z=getZone(id);z.on=on;
  document.querySelector(`.chip[data-z=${id}]`).setAttribute("aria-pressed",on);
  if(on){if(!z.labels)z.buildLabels();z.load(false);if(fly)map.flyToBounds([[z.S,z.W],[z.b[3],z.E]],{padding:[10,10],duration:1})}
  applyLayers();
}
function applyLayers(){
  if(NT.ov)F.nt?NT.ov.addTo(map):map.removeLayer(NT.ov);
  zones.forEach(z=>{
    if(z.ov)(z.on&&F.wx)?z.ov.addTo(map):map.removeLayer(z.ov);
    (z.on&&F.bd)?z.lines.addTo(map):map.removeLayer(z.lines);
  });
  updateLabels();
}
function updateLabels(){
  if(!map)return;const z=map.getZoom();
  map.getContainer().classList.toggle("nolbl",z<6.5);
  (F.ct&&z>=6.5)?map.cities.addTo(map):map.removeLayer(map.cities);   // city dots/names only when zoomed in
  zones.forEach(q=>{if(!q.labels)return;
    q.labels.forEach(l=>{const want=q.on&&F.bd&&z<6.5&&z>=l.z,has=q.lg.hasLayer(l.m);
      if(want&&!has)q.lg.addLayer(l.m);else if(!want&&has)q.lg.removeLayer(l.m)})});
}
const zoneAt=(ll,quick)=>{if(!F.wx)return null;for(const z of zones)if(z.on&&z.cls){const r=z.regionAt(ll,quick);if(r)return r}return null};

/* ================= MAP INIT ================= */
function initMap(){
  map=L.map("map",{zoomControl:false,zoomSnap:.5,minZoom:2,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1});
  map.createPane("night").style.zIndex=250;               // night shading: above tiles, below weather colours
  map.createPane("wx").style.zIndex=300;                       // weather colours: above tiles, below lines/labels
  const rp=map.createPane("ref");rp.style.zIndex=350;rp.style.pointerEvents="none";
  const o={maxZoom:18,noWrap:true,bounds:[[-85,-180],[85,180]]};
  map.bases={
    street:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{...o,attribution:"Tiles © Esri"}),
    sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{...o,maxNativeZoom:17,attribution:"Imagery © Esri"})};
  map.ref=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{...o,pane:"ref"});
  let bad=0;Object.values(map.bases).forEach(l=>l.on("tileerror",()=>{if(++bad===10)toast("Base map tiles are failing to load")}));
  setSat(false);
  map.cities=L.layerGroup();
  CITIES.forEach(([n,la,lo])=>{
    L.circleMarker([la,lo],{radius:4,color:"#16222e",weight:1.5,fillColor:"#fff",fillOpacity:1})
     .bindTooltip(n,{permanent:true,direction:"right",offset:[5,0],className:"cl"})
     .on("click",e=>{L.DomEvent.stop(e);select(L.latLng(la,lo),n)}).addTo(map.cities);
  });
  map.on("zoomend",updateLabels);
  map.on("click",e=>select(e.latlng));   // tap anywhere: weather for that exact point
  map.on("mousemove",e=>{map.getContainer().style.cursor=zoneAt(e.latlng,true)?"pointer":""});
  resetView();updateLabels();
}
function setSat(on){
  sat=on;if(map.cur)map.cur.remove();
  map.cur=(on?map.bases.sat:map.bases.street).addTo(map);map.cur.bringToBack();
  on?map.ref.addTo(map):map.ref.remove();   // satellite imagery has no labels, so add Esri's place-name layer

const resetView=()=>map.fitBounds([[6.5,68],[37.3,97.5]],{padding:[10,10]});

async function loadJSON(urls,test){

/* ================= DETAIL FETCH + PANEL ================= */
async function getDetail(ll){
  const key=ll.lat.toFixed(2)+","+ll.lng.toFixed(2),c=detailCache[key];
  if(c&&Date.now()-c.t<10*60e3)return c.d;
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${ll.lat.toFixed(3)}&longitude=${ll.lng.toFixed(3)}&current=${CUR}&hourly=temperature_2m,precipitation_probability,weather_code,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&forecast_days=7&timezone=auto`;
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();

}
const sheet=$("sheet");
const openSheet=(h,big)=>{sheet.classList.toggle("big",!!big);$("sbody").innerHTML=h;sheet.style.transform="";sheet.classList.add("open")};
const closeSheet=()=>{sheet.classList.remove("open");sheet.style.transform="";if(hl){map.removeLayer(hl);hl=null}};
function nearestCity(ll){let b=null,bd=1e9;
  ALLC.forEach(c=>{const d=turf.distance([ll.lng,ll.lat],[c[2],c[1]]);if(d<bd){bd=d;b=c[0]}});return[b,Math.round(bd)]}
/* Reverse geocoding: names the tapped village/town/city and its state. Esri first, BigDataCloud as backup. Never throws. */
const placeCache={};

  const key=ll.lat.toFixed(3)+","+ll.lng.toFixed(3);if(key in placeCache)return placeCache[key];
  const get=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);
    try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(t)}};
  let out=null;
  const e=await get(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&featureTypes=Locality&langCode=en&location=${ll.lng},${ll.lat}`);
  const a=e&&!e.error&&e.address;
  if(a&&(a.City||a.Match_addr))out={name:a.City||a.Match_addr,district:a.Subregion||"",state:a.Region||"",country:""};
  const b=await get(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${ll.lat}&longitude=${ll.lng}&localityLanguage=en`);
  if(b){out=out||{name:b.locality||b.city||"",district:"",state:"",country:""};
    out.state=out.state||b.principalSubdivision||"";out.country=b.countryName||"";out.name=out.name||b.locality||b.city||""}
  if(out&&!out.name&&!out.state&&!out.country)out=null;

/* Fallback: which state/country polygon contains the point (same data as the map borders). */
function polityAt(ll){
  const pt=turf.point([ll.lng,ll.lat]);
  for(const z of zones)if(z.on)for(const it of z.items){const bb=it.f._bb;
    if(ll.lng<bb[0]||ll.lng>bb[2]||ll.lat<bb[1]||ll.lat>bb[3])continue;
    if((it.lo!=null&&ll.lng<it.lo)||(it.hi!=null&&ll.lng>it.hi))continue;
    if(turf.booleanPointInPolygon(pt,it.f))return{name:it.name,world:!!it.world}}

}
async function select(ll,label,me){

  return `<div class="hd"><div class="ic">${ic}</div><div><div class="tp">${f(c.temperature_2m)}°C</div><div class="cd">${w[1]} · Feels ${f(c.apparent_temperature)}°</div><div class="cd">High ${f(dd.temperature_2m_max[0])}° · Low ${f(dd.temperature_2m_min[0])}°</div></div>
   <div class="pl"><b>${esc(title)}</b>${where?`<span>${esc(where)}</span>`:""}${km<=700?`<span>Nearest major city: ${esc(city)} (≈${km} km)</span>`:""}<span>${ll.lat.toFixed(2)}°, ${ll.lng.toFixed(2)}°</span></div></div>
   ${sub?`<div class="cd" style="margin-top:8px">${esc(sub)}</div>`:""}
   <div class="st">${stat("Humidity",f(c.relative_humidity_2m)+"%")}${stat("Wind",f(c.wind_speed_10m)+" km/h "+dirs[Math.round(c.wind_direction_10m/22.5)%16])}${stat("Cloud cover",f(c.cloud_cover)+"%")}${stat("Rain chance",f(pp)+"%")}${stat("Precipitation",(c.precipitation||0)+" mm")}${stat("Pressure",f(c.pressure_msl)+" hPa")}${stat("Visibility",vis==null?"–":(vis/1000).toFixed(1)+" km")}</div>
   <div class="sp">Next hours</div><div class="strip">${hrs}</div><div class="sp">7-day forecast</div><div class="strip">${days}</div>`;
}
/* swipe-down to close */
(()=>{let y0=null,dy=0;const g=$("grab");
  g.addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;sheet.classList.add("drag");g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0==null)return;y0=null;sheet.classList.remove("drag");dy>70?closeSheet():sheet.style.transform=""};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
  $("x").addEventListener("pointerdown",e=>e.stopPropagation());$("x").onclick=closeSheet;})();

/* ================= SEARCH (Open-Meteo geocoding; India results first, then worldwide) ================= */
(()=>{let tm;const q=$("q"),res=$("res");
  q.addEventListener("input",()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2){res.style.display="none";return}
    tm=setTimeout(async()=>{
      try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=10&language=en&format=json`);
        const j=await r.json(),L1=(j.results||[]).sort((a,b)=>(b.country_code==="IN")-(a.country_code==="IN")).slice(0,8);
        res.innerHTML=L1.length?L1.map((x,i)=>`<button data-i="${i}">${esc(x.name)}<small>${esc([x.admin2,x.admin1,x.country].filter(Boolean).join(", "))}</small></button>`).join(""):'<button disabled>No matches</button>';
        res.style.display="block";
        res.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const x=L1[b.dataset.i],ll=L.latLng(x.latitude,x.longitude);
          res.style.display="none";q.value=x.name;q.blur();map.flyTo(ll,/^ADM1/.test(x.feature_code||"")?7:9,{duration:.9});select(ll,x.name)});
      }catch(e){res.innerHTML='<button disabled>Search unavailable</button>';res.style.display="block"}
    },300)});
  document.addEventListener("click",e=>{if(!$("sw").contains(e.target))res.style.display="none"});})();

/* ================= CURRENT LOCATION ================= */
function locate(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){toast("Location is not available in this browser");return rej()}
    navigator.geolocation.getCurrentPosition(p=>{
      const ll=L.latLng(p.coords.latitude,p.coords.longitude);
      if(map.me)map.removeLayer(map.me);
      map.me=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1,interactive:false}).addTo(map);
      res(ll);
    },err=>{toast(err.code===1?"Location permission denied":"Could not get your location");rej()},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });
}

/* ================= ROUTE PLANNER (driving route via the public OSRM server) ================= */
const RT={from:null,to:null};let routeLayer=null;
const isPlace=x=>/^PPL/.test(x.feature_code||"");   // populated places only: cities, towns, villages (no streets/buildings)
const placeSub=x=>[x.admin2,x.admin1,x.country].filter(Boolean).join(", ");
async function placeSearch(v){
  try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=15&language=en&format=json`);
    const j=await r.json();return(j.results||[]).filter(isPlace).sort((a,b)=>(b.country_code==="IN")-(a.country_code==="IN")).slice(0,6)}
  catch(e){return[]}
}
const checkGo=()=>{$("rgo").disabled=!($("rfrom").value.trim()&&$("rto").value.trim())};
function suggest(input,list,key){
  let tm;
  input.addEventListener("input",()=>{RT[key]=null;checkGo();clearTimeout(tm);const v=input.value.trim();
    if(v.length<2){list.style.display="none";return}
    tm=setTimeout(async()=>{
      const r=await placeSearch(v);
      list.innerHTML=r.length?r.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.name)}<small>${esc(placeSub(x))}</small></button>`).join(""):'<button type="button" disabled>No city, town or village found</button>';
      list.style.display="block";
      list.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const x=r[b.dataset.i];
        RT[key]={name:x.name,lat:x.latitude,lng:x.longitude};input.value=x.name;list.style.display="none";checkGo()});
    },300);
  });
}
function openRoute(){$("rtmodal").hidden=false;$("rclr").hidden=!routeLayer;$("rmsg").textContent="";setTimeout(()=>$("rfrom").focus(),50)}
function closeRoute(){$("rtmodal").hidden=true;$("sgf").style.display=$("sgt").style.display="none"}
function clearRoute(silent){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}if(!silent)closeSheet()}
async function goRoute(){
  const msg=$("rmsg"),go=$("rgo");msg.textContent="";go.disabled=true;go.textContent="Finding route...";
  try{
    for(const k of["from","to"])if(!RT[k]){   // typed but not picked from the list: use the best match
      const v=$(k==="from"?"rfrom":"rto").value.trim(),r=await placeSearch(v);
      if(!r.length)throw new Error(`Couldn't find "${v}" as a city, town or village`);
      RT[k]={name:r[0].name,lat:r[0].latitude,lng:r[0].longitude};
    }
    const a=RT.from,b=RT.to;
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    const j=await r.json();
    if(j.code!=="Ok"||!j.routes.length)throw new Error("No driving route found between these places");
    closeRoute();showRoute(a,b,j.routes[0]);
  }catch(e){msg.textContent=e instanceof TypeError?"Route service unavailable. Try again later.":e.message}
  finally{go.textContent="Show route";checkGo()}
}
/* Draw the road as a white-cased blue line with start/end markers, then summarise it in the bottom sheet. */
function showRoute(a,b,rt){
  clearRoute(true);
  const ll=rt.geometry.coordinates.map(c=>[c[1],c[0]]),dot=(p,c)=>L.circleMarker([p.lat,p.lng],{radius:8,color:"#fff",weight:3,fillColor:c,fillOpacity:1}).bindTooltip(p.name,{permanent:true,direction:"top",offset:[0,-8],className:"rl"});
  routeLayer=L.layerGroup([L.polyline(ll,{color:"#fff",weight:10,opacity:.95,lineJoin:"round"}),L.polyline(ll,{color:"#1d4ed8",weight:5,lineJoin:"round"}),dot(a,"#16a34a"),dot(b,"#dc2626")]).addTo(map);
  map.fitBounds(L.latLngBounds(ll),{paddingTopLeft:[20,80],paddingBottomRight:[20,Math.round(innerHeight*.52)]});
  routeSheet(a,b,rt,ll);
}
/* ================= SOLAR CAR ESTIMATE =================
   Car assumptions (edit freely): roof/hood solar panels, small wind turbines, and thermoelectric generators (TEG)
   on the motor + inverter. Solar and wind use live Open-Meteo forecasts for the hour you will reach each part of the
   route; heat is a fixed estimate (no live data). */
const CAR={solarArea:2.5,solarEff:.22,solarDerate:.85,      // m², panel efficiency, temperature/MPPT/dirt losses
  turbArea:.3,turbCp:.3,turbEta:.85,turbCt:.8,turbCut:3,turbRated:500,heightFactor:.7,  // m², power coeff, generator eff, thrust coeff, cut-in m/s, rated W, 10 m→car height wind
  tegHeatW:4200,tegCapture:.6,tegEff:.04,warmMin:5};         // motor 3 kW + inverter 1.2 kW waste heat, share of heat the TEGs touch, TEG efficiency, warm-up minutes
const hav=(a,b)=>{const dLa=(b[0]-a[0])*R,dLo=(b[1]-a[1])*R,x=Math.sin(dLa/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin(dLo/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const bearing=(a,b)=>{const dl=(b[1]-a[1])*R,y=Math.sin(dl)*Math.cos(b[0]*R),x=Math.cos(a[0]*R)*Math.sin(b[0]*R)-Math.sin(a[0]*R)*Math.cos(b[0]*R)*Math.cos(dl);return(Math.atan2(y,x)/R+360)%360};
const fmtW=w=>w>=1000?(w/1000).toFixed(2)+" kW":Math.round(w)+" W",fmtE=e=>e>=1000?(e/1000).toFixed(2)+" kWh":Math.round(e)+" Wh";
async function carEstimate(ll,distM,durS){
  const hrs=durS/3600,v=distM/durS;                                           // trip hours, average car speed (m/s)
  // heat (TEG): fixed estimate from motor + inverter waste heat, minus warm-up time
  const tegP=CAR.tegHeatW*CAR.tegCapture*CAR.tegEff,tegH=Math.max(0,hrs-CAR.warmMin/60),tegE=tegP*tegH;
  const out={heat:{p:tegP,e:tegE,avg:tegE/hrs},hrs,v,wx:null};
  // sample the route: n points at the middle of n equal-length pieces, each with its travel direction
  const cum=[0];for(let i=1;i<ll.length;i++)cum.push(cum[i-1]+hav(ll[i-1],ll[i]));
  const total=cum[cum.length-1],n=Math.max(3,Math.min(15,Math.round(total/40000))),P=[];
  for(let s=0;s<n;s++){let k=cum.findIndex(c=>c>=(s+.5)/n*total);if(k<1)k=1;
    P.push({p:ll[k],hd:bearing(ll[Math.max(0,k-3)],ll[Math.min(ll.length-1,k+3)])})}
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${P.map(x=>x.p[0].toFixed(3)).join(",")}&longitude=${P.map(x=>x.p[1].toFixed(3)).join(",")}&hourly=temperature_2m,weather_code,precipitation,shortwave_radiation,wind_speed_10m,wind_direction_10m,is_day&wind_speed_unit=ms&forecast_days=3&timezone=GMT`;
    const r=await fetch(u);if(!r.ok)throw 0;let j=await r.json();if(!Array.isArray(j))j=[j];
    const now=Date.now(),segH=hrs/n;let sE=0,wE=0,dragE=0,day=0,ghiSum=0,ghiN=0,vaxSum=0,wdSum=0,rain=0;
    const pick=(h,t)=>Math.max(0,Math.min(h.time.length-1,Math.round((t-Date.parse(h.time[0]+"Z"))/36e5)));
    P.forEach((q,s)=>{
      const h=j[s].hourly,t=now+(s+.5)/n*durS*1000,i=pick(h,t);q.i=i;q.h=h;
      // SOLAR: horizontal panels, so use global horizontal irradiance; zero after dark
      const isDay=h.is_day[i]===1,ghi=isDay?h.shortwave_radiation[i]:0;
      if(isDay){day++;ghiSum+=ghi;ghiN++}
      sE+=ghi*CAR.solarArea*CAR.solarEff*CAR.solarDerate*segH;
      // WIND: wind blows FROM wd. Component of wind along our heading (+ = tailwind), then airflow through the rotor = car speed − that.
      const wsRaw=h.wind_speed_10m[i],ws=wsRaw*CAR.heightFactor,wd=h.wind_direction_10m[i]*R,hr=q.hd*R;
      const along=-ws*(Math.sin(wd)*Math.sin(hr)+Math.cos(wd)*Math.cos(hr)),vax=Math.max(0,v-along);
      const pr=h.precipitation[i]||0,rf=pr>=2.5?.85:pr>=.5?.93:1;               // rain slightly lowers turbine output
      if(pr>=.5)rain++;
      let pw=0,pd=0;
      if(wsRaw<=20&&vax>=CAR.turbCut){                                           // cut-in, and cut-out in storm winds
        pw=Math.min(CAR.turbRated,.5*1.2*CAR.turbArea*CAR.turbCp*CAR.turbEta*vax**3)*rf;
        pd=.5*1.2*CAR.turbArea*CAR.turbCt*vax**2*v;                              // extra drag power the turbines cost
      }
      wE+=pw*segH;dragE+=pd*segH;vaxSum+=vax;wdSum+=along;
    });
    out.wx={n,dayShare:day/n,startDay:j[0].hourly.is_day[P[0].i]===1,ghi:ghiN?ghiSum/ghiN:0,
      solar:{e:sE,avg:sE/hrs},wind:{e:wE,avg:wE/hrs,drag:dragE/hrs,vax:vaxSum/n,along:wdSum/n,rain:rain/n},
      ends:[0,n-1].map(k=>{const h=P[k].h,i=P[k].i;return`${(WMO[h.weather_code[i]]||["❔"])[0]} ${Math.round(h.temperature_2m[i])}°C`})};
  }catch(e){console.error(e)}
  return out;
}
async function routeSheet(a,b,rt,ll){
  const tok=++selTok;if(hl){map.removeLayer(hl);hl=null}
  openSheet('<div class="ld">Estimating power generation along the route...</div>',true);
  const km=Math.round(rt.distance/1000),m=Math.round(rt.duration/60),dur=m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
  const E=await carEstimate(ll,rt.distance,rt.duration);if(tok!==selTok)return;
  const w=E.wx,card=(t,big,l1,l2)=>`<div class="pc${t==="Total"?" tot":""}"><b>${t}</b><big>${big}</big><small>${l1}</small><small>${l2||""}</small></div>`;
  let sol,wnd;
  if(w){
    const sd=w.dayShare;
    sol=card("☀️ Solar",fmtW(w.solar.avg),`${fmtE(w.solar.e)} over the trip`,sd===0?"🌙 Night for the whole trip: no solar power":`${w.startDay?"Starts in daylight":"Starts at night"} · ${Math.round(sd*100)}% of trip in daylight · avg sun ${Math.round(w.ghi)} W/m²`);
    const wd=w.wind;
    wnd=card("💨 Wind",fmtW(wd.avg),`${fmtE(wd.e)} over the trip`,`Rotor airflow ≈ ${wd.vax.toFixed(1)} m/s · ${wd.along>=0?"tailwind":"headwind"} ${Math.abs(wd.along).toFixed(1)} m/s${wd.rain>0?` · rain on ${Math.round(wd.rain*100)}% of route`:""}${wd.drag>1?` · turbine drag ≈ ${fmtW(wd.drag)}`:""}`);
  }else{sol=card("☀️ Solar","–","Live weather unavailable","Can't estimate right now");wnd=card("💨 Wind","–","Live weather unavailable","Can't estimate right now")}
  const heat=card("🔥 Heat (TEG)",fmtW(E.heat.avg),`${fmtE(E.heat.e)} over the trip`,`Fixed estimate ≈ ${Math.round(E.heat.p)} W while driving (motor + inverter heat)`);
  const totE=(w?w.solar.e+w.wind.e:0)+E.heat.e,totP=(w?w.solar.avg+w.wind.avg:0)+E.heat.avg;
  const tot=card("Total",fmtW(totP),`${fmtE(totE)} over the trip`,w?"Solar + wind + heat":"Heat only (no live weather)");
  openSheet(`<div class="hd"><div class="ic">🧭</div><div><div class="tp">${km} km</div><div class="cd">About ${dur} by road</div></div>
   <div class="pl"><b>${esc(a.name)} → ${esc(b.name)}</b>${w?`<span>${esc(w.ends[0])} near start · ${esc(w.ends[1])} near end</span>`:""}</div></div>
   <div class="pw">${sol}${wnd}${heat}${tot}</div>
   <div class="fn">Estimated generation while travelling. Solar and wind use live forecasts for the time you reach each part of the road, with the wind measured against your direction of travel. Heat is a fixed estimate. Assumes ${CAR.solarArea} m² solar panels (${Math.round(CAR.solarEff*100)}%), ${CAR.turbArea} m² turbines, and TEGs on the motor and inverter. Wind figures are gross output and don't subtract the extra drag.</div>
   <button id="rtclear" type="button" class="chip">Clear route</button>`,true);
  $("rtclear").onclick=()=>clearRoute();
}
suggest($("rfrom"),$("sgf"),"from");suggest($("rto"),$("sgt"),"to");
$("rtbtn").onclick=openRoute;$("rtx").onclick=closeRoute;$("rgo").onclick=goRoute;$("rclr").onclick=()=>{clearRoute();closeRoute()};
$("ruse").onclick=()=>locate().then(ll=>{RT.from={name:"Your location",lat:ll.lat,lng:ll.lng};$("rfrom").value="Your location";checkGo()}).catch(()=>{});
$("rtmodal").addEventListener("click",e=>{if(e.target===$("rtmodal"))closeRoute()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("rtmodal").hidden)closeRoute()});
document.addEventListener("click",e=>{if(!e.target.closest(".fld"))$("sgf").style.display=$("sgt").style.display="none"});
[$("rfrom"),$("rto")].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("rgo").disabled)goRoute()}));

/* ================= NIGHT SHADING (from the sun's position, covers land and oceans) ================= */
const NT={ov:null};
function drawNight(){
  const now=new Date(),yT=mercY(85),w=720,dy=.5*R,h=Math.ceil(2*yT/dy);
  const N=(now-Date.UTC(now.getUTCFullYear(),0,0))/864e5,B=2*Math.PI*(N-81)/364;
  const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);               // equation of time (minutes)
  const dec=23.44*R*Math.sin(2*Math.PI*(N-81)/365),utc=now.getUTCHours()+now.getUTCMinutes()/60;
  const subLon=-15*(utc-12+eot/60),sd=Math.sin(dec),cd=Math.cos(dec);          // longitude where the sun is overhead
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),im=x.createImageData(w,h);
  for(let j=0;j<h;j++){
    const lat=invY(yT-(j+.5)*dy)*R,sl=Math.sin(lat)*sd,cl=Math.cos(lat)*cd;
    for(let i=0;i<w;i++){
      const lon=-180+(i+.5)*360/w,alt=Math.asin(Math.max(-1,Math.min(1,sl+cl*Math.cos((lon-subLon)*R))))/R;
      const t=Math.max(0,Math.min(1,(4-alt)/14)),k=(j*w+i)*4;                  // smooth twilight: lit above 4°, dark below −10°
      im.data[k]=8;im.data[k+1]=14;im.data[k+2]=44;im.data[k+3]=Math.round(t*t*(3-2*t)*150);
    }
  }
  x.putImageData(im,0,0);
  const url=c.toDataURL("image/png"),b=[[invY(yT-h*dy),-180],[85,180]];
  if(NT.ov){NT.ov.setUrl(url);NT.ov.setBounds(b)}else NT.ov=L.imageOverlay(url,b,{pane:"night",interactive:false});
  applyLayers();
}

/* ================= CONTROLS + STATUS ================= */
function wire(){
  $("zi").onclick=()=>map.zoomIn();$("zo").onclick=()=>map.zoomOut();$("rst").onclick=()=>{closeSheet();resetView()};
  $("bt").onclick=()=>setSat(!sat);
  $("ref").onclick=()=>zones.forEach(z=>z.on&&z.load(true));
  $("lyb").onclick=()=>{const l=$("lay");l.style.display=l.style.display==="block"?"none":"block"};
  $("loc").onclick=()=>locate().then(ll=>{map.flyTo(ll,10,{duration:.9});select(ll,null,true)}).catch(()=>{});
  $("lay").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{F[cb.dataset.l]=cb.checked;applyLayers()});
  $("chips").innerHTML=Object.keys(ZDEF).map(k=>`<button class="chip" data-z="${k}" aria-pressed="false" disabled>${ZDEF[k].name}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const z=zones.find(q=>q.id===b.dataset.z);setZone(b.dataset.z,!(z&&z.on),true)});
  if(innerWidth<640)$("legend").open=false;
  $("lgb").innerHTML=CL.map(c=>`<div><i style="background:${c[1]}"></i>${c[2]} ${c[0]}</div>`).join("");
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function setStatus(s){
  const t=$("stx");$("dot").className=s==="ok"?"ok":s==="err"?"err":"";
  if(s==="load"){t.textContent="Loading live weather...";$("ref").classList.add("spin")}
  else if(s==="err")t.textContent="Weather data temporarily unavailable";
  else tick();
}
function syncStatus(){
  if(zones.some(z=>z.busy))return;$("ref").classList.remove("spin");
  const on=zones.filter(z=>z.on);
  if(on.every(z=>z.pts.length)&&!on.some(z=>z.fail))setStatus("ok");
  else if(on.some(z=>z.pts.length)){setStatus("ok");toast("Some areas could not be loaded")}
  else{setStatus("err");toast("Weather data temporarily unavailable")}
}
function tick(){
  const l=zones.filter(z=>z.on&&z.last).map(z=>z.last);if(!l.length)return;
  const m=Math.floor((Date.now()-Math.min(...l))/60e3);
  $("stx").textContent=`Live weather · Updated ${m<1?"just now":m+" min ago"}`;
}
setInterval(()=>{if($("dot").classList.contains("ok"))tick()},30e3);
setInterval(()=>zones.forEach(z=>z.on&&z.load(true)),TTL);   // auto-refresh every 30 min

/* ================= START ================= */
(async()=>{
  initMap();wire();drawNight();setInterval(drawNight,5*60e3);
  const [st,wd]=await Promise.all([
    loadJSON(STATE_URLS,j=>j.type==="FeatureCollection"&&j.features.length>20),
    loadJSON(WORLD_URLS,j=>j.type==="FeatureCollection"&&j.features.length>100)]);
  states=st;world=wd;
  if(!states){setStatus("err");toast("Could not load state boundaries; weather zones need them to stay on land");return}
  states.features.forEach(f=>f._bb=turf.bbox(f));
  if(world)Object.keys(ZDEF).forEach(k=>{$("chips").querySelector(`[data-z=${k}]`).disabled=false});
  else{$("chips").querySelector('[data-z=sub]').disabled=false;toast("World boundary data failed to load; only India is available")}
  setZone("sub",true,false);
})();
</script>
